<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Sales Predictor</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f7fc;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:420px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0px 8px 20px rgba(0,0,0,0.2);
            text-align:center;
        }

        h1{
            color:#0d47a1;
            margin-bottom:10px;
        }

        h3{
            color:#555;
            margin-bottom:25px;
        }

        label{
            display:block;
            text-align:left;
            font-weight:bold;
            margin-bottom:8px;
        }

        input{
            width:100%;
            padding:12px;
            font-size:16px;
            border:1px solid #ccc;
            border-radius:8px;
            margin-bottom:20px;
        }

        button{
            width:100%;
            padding:12px;
            background:#1565c0;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#0d47a1;
        }

        .result{
            margin-top:25px;
            padding:15px;
            border-radius:8px;
            background:#e8f5e9;
            color:green;
            font-size:20px;
            font-weight:bold;
        }

        footer{
            margin-top:20px;
            font-size:13px;
            color:#777;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Weekly Sales Predictor</h1>

    <h3>Simple Linear Regression</h3>

    <form action="/predict" method="POST">

        <label>Enter Fuel Price</label>

        <input
            type="number"
            name="fuel_price"
            step="0.01"
            min="0"
            placeholder="Example : 3.50"
            required>

        <button type="submit">
            Predict Weekly Sales
        </button>

    </form>

    {% if prediction_text %}
    <div class="result">
        {{ prediction_text }}
    </div>
    {% endif %}

    <footer>
        Machine Learning by Vinayak Ramesh Patil
    </footer>

</div>

</body>
</html>
