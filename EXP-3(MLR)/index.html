<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Package Predictor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f7fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 430px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 8px;
        }

        h3 {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            font-size: 18px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0d47a1;
        }

        .result {
            margin-top: 25px;
            background: #e8f5e9;
            color: green;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Package Predictor</h1>
        <h3>Multiple Linear Regression</h3>

        <form action="/predict" method="POST">

            <label for="cgpa">Enter Student CGPA</label>

            <input
                type="number"
                id="cgpa"
                name="cgpa"
                step="0.01"
                min="0"
                max="10"
                placeholder="Example: 8.25"
                required
            >

            <label for="iq">Enter IQ Score</label>

            <input
                type="number"
                id="iq"
                name="iq"
                placeholder="Example: 120"
                required
            >

            <button type="submit">
                Predict Package
            </button>

        </form>

        {% if prediction_text %}

        <div class="result">
            {{ prediction_text }}
        </div>

        {% endif %}

        <footer>
            Machine Learning by Vinayak Ramesh Patil
        </footer>

    </div>

</body>

</html>
