<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walmart Weekly Sales Prediction</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f6fc;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 32px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    h1 {
      margin: 0 0 8px;
      color: #1565c0;
      text-align: center;
    }

    h3 {
      margin: 0 0 22px;
      color: #666;
      text-align: center;
      font-weight: normal;
    }

    label {
      display: block;
      margin: 13px 0 6px;
      color: #333;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: #fff;
      font-size: 16px;
    }

    input:focus,
    select:focus {
      outline: 2px solid #1565c0;
      outline-offset: 1px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #1565c0;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #0d47a1;
    }

    .result,
    .error {
      margin-top: 22px;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    .result {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .error {
      background: #ffebee;
      color: #b71c1c;
    }

    footer {
      margin-top: 20px;
      color: #777;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Walmart Sales Predictor</h1>
    <h3>Multiple Linear Regression</h3>

    <form action="/predict" method="POST">
      <label for="Holiday_Flag">Holiday Flag</label>
      <select id="Holiday_Flag" name="Holiday_Flag" required>
        <option value="">Select holiday status</option>
        <option value="0">No Holiday</option>
        <option value="1">Holiday</option>
      </select>

      <label for="Temperature">Temperature</label>
      <input
        id="Temperature"
        type="number"
        name="Temperature"
        step="any"
        placeholder="Example: 42.31"
        required
      >

      <label for="Fuel_Price">Fuel Price</label>
      <input
        id="Fuel_Price"
        type="number"
        name="Fuel_Price"
        min="0"
        step="any"
        placeholder="Example: 2.572"
        required
      >

      <label for="CPI">CPI</label>
      <input
        id="CPI"
        type="number"
        name="CPI"
        min="0"
        step="any"
        placeholder="Example: 211.096358"
        required
      >

      <label for="Unemployment">Unemployment</label>
      <input
        id="Unemployment"
        type="number"
        name="Unemployment"
        min="0"
        step="any"
        placeholder="Example: 8.106"
        required
      >

      <button type="submit">Predict Weekly Sales</button>
    </form>

    {% if prediction_text %}
      <div class="result" role="status">{{ prediction_text }}</div>
    {% endif %}

    {% if error_text %}
      <div class="error" role="alert">{{ error_text }}</div>
    {% endif %}

    <footer>By Vinayak Ramesh Patil</footer>
  </main>
</body>
</html>
